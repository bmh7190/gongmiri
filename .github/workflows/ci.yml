name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Install Chrome for Testing
        shell: bash
        run: |
          npx --yes @puppeteer/browsers@3.2.2 install chrome@stable --path "$RUNNER_TEMP/chrome-for-testing"
          chrome_bin="$(find "$RUNNER_TEMP/chrome-for-testing" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -x "$chrome_bin"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

      - name: Run browser regression checks
        run: |
          node scripts/verify-column-resize.mjs --invalid-zip
          node scripts/verify-column-resize.mjs --granted-downloads
